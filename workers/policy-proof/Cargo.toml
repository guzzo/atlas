[package]
name = "passport-policy-proof"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bulletproofs = "=5.0.0"
cedar-policy = { version = "=4.13.0", default-features = false }
curve25519-dalek = { version = "4", features = ["rand_core"] }
hex = "0.4"
merlin = "3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
debug = 0
strip = true
